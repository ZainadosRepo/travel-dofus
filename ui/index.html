<!doctype html>
<html lang="fr" data-theme="standard">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Travel Dofus</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="themes.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <main class="window">
      <header class="titlebar" data-tauri-drag-region>
        <h1 data-tauri-drag-region>Travel Dofus</h1>
        <select id="profile" aria-label="Profil" title="Profil"></select>
        <button id="open-settings" class="icon-btn" type="button" aria-label="Réglages" title="Réglages">&#9881;</button>
        <button id="minimize" class="icon-btn" type="button" aria-label="Réduire" title="Réduire (Ctrl + Alt + P pour réafficher)">&#8211;</button>
        <button id="close" class="icon-btn" type="button" aria-label="Fermer" title="Fermer">&#10005;</button>
      </header>
      <p id="banner" class="banner" hidden></p>
      <section class="controls">
        <input id="query" type="search" placeholder="PNJ, zone, zaap ou position (4,-18)" autocomplete="off" spellcheck="false" autofocus />
        <div class="row">
          <label class="from">
            Ma position
            <input id="from" placeholder="3,-17" autocomplete="off" spellcheck="false" title="Pour comparer marche et zaap" />
          </label>
          <button id="mode" class="chip" type="button" title="Tab pour changer"></button>
        </div>
      </section>
      <ol id="results" class="results" aria-live="polite"></ol>
      <p id="empty" class="empty"></p>
      <footer id="footer" class="footer"></footer>
    </main>

    <dialog id="settings" class="panel">
      <header class="panel-head">
        <h2>Réglages</h2>
        <button class="icon-btn" type="button" data-close aria-label="Fermer">&#10005;</button>
      </header>
      <div class="panel-body">
        <label class="field">Thème <select id="theme"></select></label>
        <label class="field">Langue des noms <select id="lang"></select></label>
        <label class="field">
          <span>Anti lag <output id="antilag-value"></output></span>
          <input id="antilag" type="range" min="1" max="5" step="1" />
        </label>
        <p class="help">Nombre de /zaap copiés avant le /travel, pour laisser la carte charger.</p>
        <label class="field">
          <span>Opacité <output id="opacity-value"></output></span>
          <input id="opacity" type="range" min="30" max="100" step="5" />
        </label>
        <section>
          <h3>Profils</h3>
          <p class="help">Chaque profil garde ses 6 favoris (touches Alt + 1 à 6).</p>
          <div class="inline">
            <button id="profile-add" class="btn secondary" type="button">Nouveau</button>
            <button id="profile-rename" class="btn secondary" type="button">Renommer</button>
            <button id="profile-delete" class="btn secondary" type="button">Supprimer</button>
          </div>
        </section>
        <section>
          <h3>Mes positions</h3>
          <ul id="customs-list" class="mini-list"></ul>
          <button id="custom-add" class="btn secondary" type="button">Ajouter une position</button>
        </section>
        <section>
          <h3>Corrections</h3>
          <ul id="fixes-list" class="mini-list"></ul>
        </section>
      </div>
    </dialog>

    <dialog id="editor" class="panel">
      <form id="editor-form" method="dialog">
        <header class="panel-head">
          <h2 id="editor-title"></h2>
          <button class="icon-btn" type="button" data-close aria-label="Annuler">&#10005;</button>
        </header>
        <div id="editor-fields" class="panel-body"></div>
        <p id="editor-error" class="form-error" hidden></p>
        <footer class="panel-foot">
          <button class="btn secondary" type="button" data-close>Annuler</button>
          <button class="btn primary" type="submit">Enregistrer</button>
        </footer>
      </form>
    </dialog>

    <div id="menu" class="menu" role="menu" hidden></div>
    <p id="toast" class="toast" role="status" hidden></p>
  </body>
</html>
