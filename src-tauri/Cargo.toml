[package]
name = "travel-dofus"
version = "0.3.0"
description = "Find Dofus NPCs, zaaps and map markers, and copy the /zaap + /travel route"
authors = ["ZainadosRepo"]
edition = "2021"
publish = false

[lib]
name = "travel_dofus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
dofus-data = { path = "../crates/dofus-data" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-window-state = "2.5"
