name: Release

# Builds the Windows installer (.exe) and the macOS disk image (.dmg) into a draft release,
# plus the signed update files (.sig, .app.tar.gz, latest.json) the installed apps check at launch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            targets: ""
          - os: macos-latest
            # `app` too: the updater installs the .app.tar.gz, which a dmg-only build drops.
            args: --target universal-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install -g @tauri-apps/cli@2
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: tauri
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: Travel Dofus v__VERSION__
          releaseDraft: true
